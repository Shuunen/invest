# Invest Workflow Dependency Bump And Schema Augmentation

## Action

Follow the dependency-bump-and-schema-augmentation workflow:
1. Update package.json and pnpm-lock.yaml with new dependency versions.
2. Modify or refactor files in src/schemas/ (e.g., add fields, change types).
3. Update related code in src/components/, src/pages/, src/utils/ to use new or changed schema.
4. Update or add tests for schema or affected features.
5. Optionally update CHANGELOG.md and bump VERSION.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: package.json, pnpm-lock.yaml, src/schemas/**/*.ts

