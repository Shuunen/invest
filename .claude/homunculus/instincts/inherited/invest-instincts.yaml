# Invest Workflow Feature Development With Tests And Docs

## Action

Follow the feature-development-with-tests-and-docs workflow:
1. Implement or update feature code (often in src/components, src/pages, or src/utils).
2. Add or update corresponding test files (e.g., .test.tsx or .test.ts).
3. Update documentation files (e.g., CLAUDE.md, TODOS.md, EXPORT_FORMAT.md, REVIEW.md).
4. Update CHANGELOG.md and bump VERSION/package.json if release-worthy.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~3x per month
- Files: src/components/*.tsx, src/pages/**/*.tsx, src/utils/**/*.ts

